# Builds fresh hazard data every 3 hours and publishes the site to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source = "GitHub Actions".
name: Build and deploy site
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Take the latest Earth Engine data
        run: |
          if git ls-remote --exit-code --heads origin gee-data; then
            git fetch --depth 1 origin gee-data
            rm -rf data/gee
            git checkout FETCH_HEAD -- data/gee
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test
      - name: Build live data (Open-Meteo, optional NASA FIRMS)
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: node scripts/build-latest.mjs || echo "::warning::data build failed; the site will compute live in the browser"
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html css js vendor data docs _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
