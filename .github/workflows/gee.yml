# Daily risk update from Google Earth Engine.
# One-time setup: repository secret EE_SERVICE_ACCOUNT_JSON, see docs/GEE_SETUP.md.
#
# The results do not go to main: about 10 MB of files change every day and would pile up in the history for ever.
# They go to the branch gee-data, which always holds one single commit and is replaced on each run.
# pages.yml reads the site data from that branch. data/gee on main is only the starting copy.
#
# A failed download or data older than 3 days fails this job, so GitHub reports it and the last good data stay online.
name: Update risk from Earth Engine
on:
  schedule:
    - cron: "40 22 * * *" # 06:40 Ulaanbaatar time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/gee.yml", "pipeline/**"]
permissions:
  contents: write
  actions: write # a push by this job does not trigger pages.yml, so the job starts it itself
concurrency:
  group: gee
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check the secret
        env:
          KEY: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::Secret EE_SERVICE_ACCOUNT_JSON is not set. See docs/GEE_SETUP.md"; exit 1; fi
      - uses: actions/checkout@v4
      - name: Take the latest data
        run: |
          if git ls-remote --exit-code --heads origin gee-data; then
            git fetch --depth 1 origin gee-data
            rm -rf data/gee pipeline/state
            git checkout FETCH_HEAD -- data/gee pipeline/state
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Run the update
        env:
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          HAZARD_CACHE: ${{ runner.temp }}/gee_cache
        run: python pipeline/update.py
      - name: Replace the data branch
        run: |
          git config user.name "hazard-bot"
          git config user.email "actions@users.noreply.github.com"
          say() { echo "::error::$1: $(tail -c 500 git.log | tr '\n' ' ')"; exit 1; }
          git checkout --orphan gee-data-new > git.log 2>&1 || say checkout
          git rm -r -q --cached . > git.log 2>&1 || say rm
          git add -f data/gee pipeline/state > git.log 2>&1 || say add
          git commit -q -m "Earth Engine data $(date -u +%F)" > git.log 2>&1 || say commit
          git push --force origin HEAD:refs/heads/gee-data > git.log 2>&1 || say push
      - name: Publish the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
