# Daily risk update from Google Earth Engine.
# One-time setup: repository Settings -> Secrets and variables -> Actions -> New repository secret,
# name EE_SERVICE_ACCOUNT_JSON, value = the JSON key of a service account registered for Earth Engine.
# See docs/GEE_SETUP.md. Without the secret this job stops at the first step and the site keeps its last data.
name: Update risk from Earth Engine
on:
  schedule:
    - cron: "40 22 * * *" # 06:40 Ulaanbaatar time
  workflow_dispatch:
permissions:
  contents: write
  actions: write # a commit by this job does not trigger pages.yml, so the job starts it itself
concurrency:
  group: gee
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check the secret
        env:
          KEY: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::Secret EE_SERVICE_ACCOUNT_JSON is not set. See docs/GEE_SETUP.md"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Run the update
        env:
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          HAZARD_CACHE: ${{ runner.temp }}/gee_cache
        run: python pipeline/update.py
      - name: Commit the new data
        run: |
          git config user.name "hazard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/gee pipeline/state
          git diff --cached --quiet || git commit -m "Earth Engine update $(date -u +%F)"
          git push
      - name: Publish the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
